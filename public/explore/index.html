<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e27">
    <title>Explore - GFox Git</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --accent: #06b6d4;
            --bg-primary: #fafbfc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f3f4f6;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --border: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.03);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --radius: 16px;
            --radius-lg: 20px;
            --transition-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 100px;
        }

        /* Header - Premium Glassmorphism */
        .header {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(30, 41, 59, 0.95) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: white;
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .header-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.2); }

        .header-title {
            flex: 1;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-indicator {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        /* Search Bar */
        .search-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 16px 14px 48px;
            font-size: 15px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            width: 18px;
            height: 18px;
        }

        /* Tabs */
        .tabs-container {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 110px;
            z-index: 90;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tabs {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            min-width: max-content;
        }

        .tab {
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s var(--transition-spring);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab:active { transform: scale(0.95); }
        .tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Content */
        .content {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .repo-count {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-tertiary);
            background: var(--bg-tertiary);
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* Repo Grid */
        .repo-grid {
            display: grid;
            gap: 20px;
        }

        /* Premium Repo Card */
        .repo-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            animation: slideUp 0.5s var(--transition-spring) backwards;
        }

        .repo-card:active { transform: scale(0.98); }

        /* Dynamic Thumbnail */
        .repo-thumbnail {
            height: 140px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .repo-card:hover .thumbnail-img { transform: scale(1.05); }

        .thumbnail-fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 2;
        }

        .initials {
            font-size: 32px;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            letter-spacing: -0.02em;
        }

        .lang-badge {
            padding: 4px 12px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .repo-body {
            padding: 20px;
            cursor: pointer;
        }

        .repo-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 12px;
        }

        .repo-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .repo-owner {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .visibility-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        .visibility-badge.public { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .visibility-badge.private { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .repo-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .repo-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .repo-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .repo-stat svg { width: 15px; height: 15px; opacity: 0.7; }
        .repo-stat strong { color: var(--text-primary); font-weight: 700; }

        /* Action Buttons */
        .repo-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 20px 20px 20px;
        }

        .action-btn {
            padding: 10px 4px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .action-btn svg { width: 18px; height: 18px; }
        .action-btn:active { transform: scale(0.92); background: var(--bg-tertiary); }
        
        .action-btn.starred {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            border-color: transparent;
        }

        .action-btn.primary-action {
            background: var(--primary);
            color: white;
            border-color: transparent;
        }

        /* Loading Skeleton */
        .skeleton-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--border) 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Load More Button */
        .load-more-container {
            text-align: center;
            margin: 40px 0;
        }

        .load-more-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s var(--transition-spring);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .load-more-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        .load-more-btn:active {
            transform: translateY(0);
        }

        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .load-more-btn.loading svg {
            animation: spin 1s linear infinite;
        }

        /* Infinite Scroll Indicator */
        .scroll-indicator {
            text-align: center;
            padding: 20px;
            color: var(--text-tertiary);
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .scroll-indicator.show {
            display: block;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f172a;
            color: white;
            padding: 14px 24px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s var(--transition-spring);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: var(--bg-tertiary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
        }

        @media (max-width: 640px) {
            .repo-actions { grid-template-columns: repeat(2, 1fr); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-top">
            <button class="header-btn" onclick="window.location.href='index.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="header-title">
                <span class="live-indicator"></span>
                Explore
            </h1>
            <button class="header-btn" onclick="loadRepos(true)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
        </div>
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search repositories..." oninput="handleSearch(this.value)">
        </div>
    </header>

    <div class="tabs-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('new', this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Newly Uploaded
            </div>
            <div class="tab" onclick="switchTab('trending', this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                Trending
            </div>
            <div class="tab" onclick="switchTab('top', this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                Top Rated
            </div>
        </div>
    </div>

    <div class="content">
        <div class="section-header">
            <h2 class="section-title">Discover Projects</h2>
            <span class="repo-count" id="repoCount">Loading...</span>
        </div>

        <div class="repo-grid" id="repoGrid">
            <!-- Real repos load here -->
        </div>

        <div class="scroll-indicator" id="scrollIndicator">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;vertical-align:middle;margin-right:8px;animation:spin 1s linear infinite">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
            </svg>
            Loading more repositories...
        </div>

        <div class="load-more-container" id="loadMoreContainer" style="display:none">
            <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreRepos()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                Load More Repositories
            </button>
        </div>

        <div class="empty-state" id="emptyState" style="display:none">
            <div class="empty-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
            <h3 style="font-size:18px;font-weight:700;margin-bottom:8px;">No repositories found</h3>
            <p style="font-size:14px;">Try adjusting your search terms.</p>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <script>
        let state = {
            token: '',
            currentTab: 'new',
            searchQuery: '',
            repos: [],
            page: 1,
            perPage: 100, // Increased from 20 to 100 (GitHub API max)
            loading: false,
            hasMore: true,
            autoRefreshInterval: null
        };

        const languageColors = {
            JavaScript: '#f1e05a', TypeScript: '#2b7489', Python: '#3572A5',
            Rust: '#dea584', Go: '#00ADD8', Java: '#b07219', Ruby: '#701516',
            PHP: '#4F5D95', Swift: '#ffac45', 'C++': '#f34b7d', C: '#555555',
            HTML: '#e34c26', CSS: '#563d7c', Shell: '#89e051', Dart: '#00B4AB',
            Vue: '#41b883', React: '#61dafb'
        };

        async function init() {
            try {
                const res = await fetch('/api/token', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    state.token = data.token;
                    await loadRepos();
                    // Auto-update every 60 seconds
                    state.autoRefreshInterval = setInterval(() => loadRepos(false), 60000);
                    
                    // Setup infinite scroll
                    setupInfiniteScroll();
                } else {
                    window.location.replace('/login/index.html');
                }
            } catch (err) {
                showToast('Authentication required', 'error');
                setTimeout(() => window.location.href = '/login/index.html', 2000);
            }
        }

        async function githubAPI(endpoint, options = {}) {
            const url = `https://api.github.com${endpoint}`;
            const headers = {
                'Authorization': `token ${state.token}`,
                'Accept': 'application/vnd.github.v3+json',
                ...options.headers
            };
            const response = await fetch(url, { ...options, headers });
            if (!response.ok) throw new Error(`API error: ${response.status}`);
            return response;
        }

        async function loadRepos(showToastOnSuccess = false, reset = true) {
            if (state.loading) return;
            state.loading = true;
            
            if (reset) {
                state.page = 1;
                state.repos = [];
                state.hasMore = true;
            }
            
            if (!showToastOnSuccess && reset) showLoading();
            
            try {
                let endpoint = `/search/repositories?per_page=${state.perPage}&page=${state.page}`;
                
                if (state.searchQuery) {
                    endpoint += `&q=${encodeURIComponent(state.searchQuery)}`;
                } else {
                    switch(state.currentTab) {
                        case 'new':
                            endpoint += '&sort=created&order=desc&q=created:>=2024-01-01';
                            break;
                        case 'trending':
                            endpoint += '&sort=stars&order=desc&q=stars:>100&created:>=2024-01-01';
                            break;
                        case 'top':
                            endpoint += '&sort=stars&order=desc&q=stars:>5000';
                            break;
                    }
                }

                const response = await githubAPI(endpoint);
                const data = await response.json();
                const newRepos = data.items || [];
                
                if (newRepos.length === 0) {
                    state.hasMore = false;
                } else {
                    state.repos = reset ? newRepos : [...state.repos, ...newRepos];
                    state.page++;
                    // GitHub allows max 1000 results (10 pages of 100)
                    if (state.page > 10) state.hasMore = false;
                }
                
                renderRepos();
                updateRepoCount();
                updateLoadMoreButton();
                
                if (showToastOnSuccess && reset) showToast('Feed updated in real-time', 'success');
                
            } catch (err) {
                console.error('Load failed:', err);
                showToast('Failed to load repositories', 'error');
            } finally {
                state.loading = false;
            }
        }

        async function loadMoreRepos() {
            if (!state.hasMore || state.loading) return;
            
            document.getElementById('scrollIndicator').classList.add('show');
            const btn = document.getElementById('loadMoreBtn');
            btn.classList.add('loading');
            btn.disabled = true;
            
            await loadRepos(false, false);
            
            document.getElementById('scrollIndicator').classList.remove('show');
            btn.classList.remove('loading');
            btn.disabled = false;
        }

        function setupInfiniteScroll() {
            let ticking = false;
            
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const scrollPosition = window.innerHeight + window.scrollY;
                        const threshold = document.body.offsetHeight - 800;
                        
                        if (scrollPosition >= threshold && state.hasMore && !state.loading) {
                            loadMoreRepos();
                        }
                        
                        ticking = false;
                    });
                    ticking = true;
                }
            });
        }

        function renderRepos() {
            const grid = document.getElementById('repoGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (state.repos.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            // Only render new repos (for infinite scroll performance)
            const startIndex = state.repos.length - (state.repos.length % state.perPage || state.perPage);
            const newRepos = state.repos.slice(startIndex);
            
            // If it's the first load, render all
            if (startIndex === 0) {
                grid.innerHTML = state.repos.map((repo, index) => createRepoCard(repo, index)).join('');
            } else {
                // Append new repos
                newRepos.forEach((repo, index) => {
                    const card = document.createElement('div');
                    card.innerHTML = createRepoCard(repo, startIndex + index);
                    grid.appendChild(card.firstElementChild);
                });
            }
        }

        function updateRepoCount() {
            const count = state.repos.length;
            const maxText = state.hasMore ? `${count}+` : count;
            document.getElementById('repoCount').textContent = `${maxText} repos`;
        }

        function updateLoadMoreButton() {
            const container = document.getElementById('loadMoreContainer');
            if (state.hasMore && state.repos.length > 0) {
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }

        function getInitials(name) {
            return name.split(/[-_]/).map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function createRepoCard(repo, index) {
            const language = repo.language || 'Code';
            const langColor = languageColors[language] || '#94a3b8';
            const initials = getInitials(repo.name);
            const branch = repo.default_branch || 'main';
            
            return `
                <div class="repo-card" style="animation-delay: ${(index % state.perPage) * 0.03}s">
                    <div class="repo-thumbnail" style="background: linear-gradient(135deg, ${langColor}33 0%, ${langColor}66 100%);">
                        <img src="https://opengraph.githubassets.com/1/${repo.full_name}" 
                             alt="${repo.name}" 
                             class="thumbnail-img"
                             loading="lazy"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="thumbnail-fallback">
                            <span class="initials">${initials}</span>
                            <span class="lang-badge" style="background:${langColor}">${language}</span>
                        </div>
                    </div>
                    <div class="repo-body" onclick="openRepo('${repo.full_name}')">
                        <div class="repo-header">
                            <div>
                                <div class="repo-name">${repo.name}</div>
                                <div class="repo-owner">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    ${repo.owner.login}
                                </div>
                            </div>
                            <span class="visibility-badge ${repo.private ? 'private' : 'public'}">${repo.private ? 'Private' : 'Public'}</span>
                        </div>
                        
                        <div class="repo-description">${repo.description || 'No description available'}</div>
                        
                        <div class="repo-meta">
                            <div class="repo-stat">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                <strong>${repo.stargazers_count?.toLocaleString() || 0}</strong>
                            </div>
                            <div class="repo-stat">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>
                                <strong>${repo.forks_count?.toLocaleString() || 0}</strong>
                            </div>
                            <div class="repo-stat">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                                <strong>${repo.open_issues_count?.toLocaleString() || 0}</strong>
                            </div>
                        </div>
                    </div>
                    
                    <div class="repo-actions">
                        <button class="action-btn" onclick="toggleStar('${repo.full_name}', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            Star
                        </button>
                        <button class="action-btn" onclick="forkRepo('${repo.full_name}', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>
                            Fork
                        </button>
                        <button class="action-btn" onclick="downloadRepo('${repo.full_name}', '${branch}')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Download
                        </button>
                        <button class="action-btn primary-action" onclick="openRepo('${repo.full_name}')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                            Open
                        </button>
                    </div>
                </div>
            `;
        }

        function showLoading() {
            const grid = document.getElementById('repoGrid');
            grid.innerHTML = Array(4).fill(0).map((_, i) => `
                <div class="skeleton-card" style="animation-delay: ${i * 0.1}s">
                    <div class="skeleton" style="height:140px;width:100%"></div>
                    <div style="padding:20px">
                        <div class="skeleton" style="height:20px;width:60%;margin-bottom:12px;border-radius:8px"></div>
                        <div class="skeleton" style="height:16px;width:40%;margin-bottom:20px;border-radius:8px"></div>
                        <div class="skeleton" style="height:14px;width:100%;margin-bottom:8px;border-radius:8px"></div>
                        <div class="skeleton" style="height:14px;width:80%;margin-bottom:20px;border-radius:8px"></div>
                        <div style="display:flex;gap:12px">
                            <div class="skeleton" style="height:20px;width:60px;border-radius:8px"></div>
                            <div class="skeleton" style="height:20px;width:60px;border-radius:8px"></div>
                            <div class="skeleton" style="height:20px;width:60px;border-radius:8px"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tab, element) {
            state.currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            loadRepos();
        }

        function handleSearch(value) {
            state.searchQuery = value;
            debounceLoad();
        }

        let searchTimeout;
        function debounceLoad() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadRepos(), 600);
        }

        function openRepo(repoName) {
            window.open(`https://github.com/${repoName}`, '_blank');
        }

        async function toggleStar(repoName, btn) {
            try {
                const isStarred = btn.classList.contains('starred');
                if (isStarred) {
                    await githubAPI(`/user/starred/${repoName}`, { method: 'DELETE' });
                    btn.classList.remove('starred');
                    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Star`;
                    showToast('Removed from starred', 'info');
                } else {
                    await githubAPI(`/user/starred/${repoName}`, { method: 'PUT' });
                    btn.classList.add('starred');
                    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Starred`;
                    showToast('Added to starred repositories', 'success');
                }
            } catch (err) {
                showToast('Failed to update star', 'error');
            }
        }

        async function forkRepo(repoName, btn) {
            try {
                btn.disabled = true;
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Forking...`;
                
                await githubAPI(`/repos/${repoName}/forks`, { method: 'POST' });
                showToast('Repository forked successfully', 'success');
                
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 7h-4V3a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v4H8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h4v4a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-4h4a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/></svg> Forked`;
                btn.style.background = 'var(--success)';
                btn.style.color = 'white';
                btn.style.borderColor = 'var(--success)';
            } catch (err) {
                showToast('Failed to fork repository', 'error');
                btn.disabled = false;
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg> Fork`;
            }
        }

        function downloadRepo(repoName, branch) {
            window.open(`https://github.com/${repoName}/archive/refs/heads/${branch}.zip`, '_blank');
            showToast('Download started', 'success');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toast.className = `toast ${type}`;
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize
        init();
    </script>
</body>
</html>
